<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hammy2.fun - Unblocked Games</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-top">
                <div class="logo-section">
                    <svg class="hammy-logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <!-- Left Ear -->
                        <circle cx="60" cy="50" r="35" fill="#FF9500" stroke="#000" stroke-width="3"/>
                        <ellipse cx="60" cy="65" rx="20" ry="25" fill="#FFB6D9" stroke="#000" stroke-width="2"/>
                        
                        <!-- Right Ear -->
                        <circle cx="140" cy="50" r="35" fill="#FF9500" stroke="#000" stroke-width="3"/>
                        <ellipse cx="140" cy="65" rx="20" ry="25" fill="#FFB6D9" stroke="#000" stroke-width="2"/>
                        
                        <!-- Head -->
                        <ellipse cx="100" cy="110" rx="50" ry="55" fill="#F5F0E1" stroke="#000" stroke-width="3"/>
                        
                        <!-- Left Eye -->
                        <circle cx="80" cy="95" r="22" fill="#000" stroke="#000" stroke-width="2"/>
                        <circle cx="82" cy="92" r="12" fill="#FFF"/>
                        <circle cx="86" cy="90" r="6" fill="#FFF"/>
                        
                        <!-- Right Eye -->
                        <circle cx="120" cy="95" r="22" fill="#000" stroke="#000" stroke-width="2"/>
                        <circle cx="122" cy="92" r="12" fill="#FFF"/>
                        <circle cx="126" cy="90" r="6" fill="#FFF"/>
                        
                        <!-- Nose -->
                        <ellipse cx="100" cy="115" rx="8" ry="6" fill="#FFB6D9"/>
                        
                        <!-- Mouth -->
                        <path d="M 95 125 Q 100 130 105 125" stroke="#000" stroke-width="2" fill="none"/>
                        <ellipse cx="100" cy="128" rx="5" ry="8" fill="#C97070"/>
                        
                        <!-- Whiskers -->
                        <line x1="50" y1="110" x2="25" y2="105" stroke="#000" stroke-width="2"/>
                        <line x1="50" y1="120" x2="25" y2="128" stroke="#000" stroke-width="2"/>
                        <line x1="150" y1="110" x2="175" y2="105" stroke="#000" stroke-width="2"/>
                        <line x1="150" y1="120" x2="175" y2="128" stroke="#000" stroke-width="2"/>
                        
                        <!-- Body -->
                        <ellipse cx="100" cy="155" rx="45" ry="35" fill="#F5F0E1" stroke="#000" stroke-width="3"/>
                        
                        <!-- Orange Spot on Body -->
                        <circle cx="115" cy="160" r="12" fill="#FF9500" stroke="#000" stroke-width="2"/>
                    </svg>
                    <h1>hammy2</h1>
                </div>
                
                <div class="header-stats">
                    <div class="stat-box time">
                        <span class="icon">⏰</span>
                        <span id="current-time">05:58 PM</span>
                    </div>
                    <div class="stat-box temp">
                        <span class="icon">☀️</span>
                        <span>91°F</span>
                    </div>
                </div>
            </div>
            
            <div class="header-secondary">
                <div class="stat-box ping">
                    <span class="icon">📡</span>
                    <span>292 ms</span>
                </div>
                <div class="stat-box battery">
                    <span class="icon">🔋</span>
                    <span>17%</span>
                </div>
            </div>
            
            <!-- Search Bar -->
            <div class="search-container">
                <input type="text" class="search-bar" placeholder="search games" id="searchInput">
                <button class="color-wheel">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="45" fill="none" stroke="#00FF00" stroke-width="3"/>
                        <circle cx="50" cy="50" r="35" fill="none" stroke="#FF00FF" stroke-width="3"/>
                        <circle cx="50" cy="50" r="25" fill="none" stroke="#00FFFF" stroke-width="3"/>
                        <circle cx="50" cy="50" r="15" fill="#00FF00"/>
                    </svg>
                </button>
            </div>
        </header>
        
        <!-- Links Section -->
        <section class="links-section">
            <h2 class="section-title">links</h2>
            
            <div class="games-grid">
                <!-- Game Card 1 -->
                <div class="game-card">
                    <div class="card-content">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23FF9500' width='100' height='100'/%3E%3Ctext x='50' y='50' font-size='40' fill='%23FFF' text-anchor='middle' dominant-baseline='middle'%3EG1%3C/text%3E%3C/svg%3E" alt="Game 1">
                    </div>
                    <div class="star-icon">⭐</div>
                </div>
                
                <!-- Game Card 2 -->
                <div class="game-card">
                    <div class="card-content">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23FFB6D9' width='100' height='100'/%3E%3Ctext x='50' y='50' font-size='40' fill='%23FFF' text-anchor='middle' dominant-baseline='middle'%3EG2%3C/text%3E%3C/svg%3E" alt="Game 2">
                    </div>
                    <div class="star-icon">⭐</div>
                </div>
                
                <!-- Game Card 3 -->
                <div class="game-card">
                    <div class="card-content">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23FF6B9D' width='100' height='100'/%3E%3Ctext x='50' y='50' font-size='40' fill='%23FFF' text-anchor='middle' dominant-baseline='middle'%3EG3%3C/text%3E%3C/svg%3E" alt="Game 3">
                    </div>
                    <div class="star-icon">⭐</div>
                </div>
                
                <!-- Game Card 4 -->
                <div class="game-card">
                    <div class="card-content">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23FF7F50' width='100' height='100'/%3E%3Ctext x='50' y='50' font-size='40' fill='%23FFF' text-anchor='middle' dominant-baseline='middle'%3EG4%3C/text%3E%3C/svg%3E" alt="Game 4">
                    </div>
                    <div class="star-icon">⭐</div>
                </div>
                
                <!-- Game Card 5 -->
                <div class="game-card">
                    <div class="card-content">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23FF8C00' width='100' height='100'/%3E%3Ctext x='50' y='50' font-size='40' fill='%23FFF' text-anchor='middle' dominant-baseline='middle'%3EG5%3C/text%3E%3C/svg%3E" alt="Game 5">
                    </div>
                    <div class="star-icon">⭐</div>
                </div>
                
                <!-- Game Card 6 -->
                <div class="game-card">
                    <div class="card-content">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23FF69B4' width='100' height='100'/%3E%3Ctext x='50' y='50' font-size='40' fill='%23FFF' text-anchor='middle' dominant-baseline='middle'%3EG6%3C/text%3E%3C/svg%3E" alt="Game 6">
                    </div>
                    <div class="star-icon">⭐</div>
                </div>
            </div>
        </section>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
